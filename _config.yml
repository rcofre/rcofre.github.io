# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Rodrigo Cofré"                                        # CHANGED: was "Website" — this is the browser tab title and Google result title on every page
title_separator          : "-"
name                     : &name "Rodrigo Cofré"                                  # CHANGED: was "rcofre" — appears in the footer copyright and structured data
description              : &description "Researcher at Inria, Université Côte d'Azur, working on the mathematical modelling of brain dynamics, information theory in neuroscience, and the neural basis of consciousness."   # CHANGED: was "personal description" — this is your meta description in search results
url                      : "https://rcofre.github.io"                             # CHANGED: was blank — sitemap.xml and feed.xml generate broken absolute URLs without it
baseurl                  : ""                                                     # CHANGED: must be empty for a user site (username.github.io)
repository               : "rcofre/rcofre.github.io"                              # CHANGED: was blank — enables GitHub metadata
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  path                   : # blank (default) uses feed.xml

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter "Cofre_Rodrigo_"                              # CHANGED: was blank, and the "@" is dropped — the theme builds twitter.com/<handle>, so a leading @ produces a malformed URL
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "/images/profile.png"                                  # CHANGED: was blank — links to your site on X/LinkedIn/Bluesky currently show an empty card. A 1200x630 figure from one of your papers would look better than the portrait; drop it in /images/ and point here.
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Person                                                 # CHANGED: was blank — feeds Google's structured data
  name                   : "Rodrigo Cofré"                                        # CHANGED: was blank
  links:                                                                          # CHANGED: was empty — helps search engines link your profiles to you
    - "https://scholar.google.fr/citations?user=jbbZoRcAAAAJ&hl=en"
    - "https://www.linkedin.com/in/rodrigo-cofre-2a41821b9"
    - "https://github.com/rcofre"
    - "https://www.researchgate.net/profile/Rodrigo-Cofre-2"
    # - "https://orcid.org/XXXX-XXXX-XXXX-XXXX"                                   # TODO: uncomment once you fill in your ORCID below


# Analytics
analytics:
  provider               : false                                                  # CHANGED: was "google-universal" — Universal Analytics was shut down in July 2023 and the tracking_id was empty anyway. Set to "google" with a GA4 ID if you want analytics, or leave false.
  google:
    tracking_id          :


# Site Author
author:
  name             : "Rodrigo Cofré"
  avatar           : "profile.png"
  bio              : "Researcher (ISFP) at Inria — CRONOS team"                    # CHANGED: was "Scientist" — this shows under your photo on every page
  location         : "Sophia Antipolis, France"                                    # CHANGED: was the whole region; a city reads more specific. Revert if you prefer.
  employer         : "Inria, Université Côte d'Azur"                               # CHANGED: was blank
  pubmed           : # "https://pubmed.ncbi.nlm.nih.gov/?term=Cofr%C3%A9%20R&cauthor_id=36464098"   # optional: uncomment to add a PubMed link to your sidebar
  googlescholar    : "https://scholar.google.fr/citations?user=jbbZoRcAAAAJ&hl=en"
  email            : "rodrigo.cofre@inria.fr"                                      # CHANGED: guessed institutional address — VERIFY THIS before pushing, or revert to rodrigocofre@gmail.com
  researchgate     : "https://www.researchgate.net/profile/Rodrigo-Cofre-2"
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "rcofre"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      : #"https://profiles.impactstory.org/u/xxxx-xxxx-xxxx-xxxx"
  lastfm           :
  linkedin         : "rodrigo-cofre-2a41821b9"
  orcid            : # "https://orcid.org/XXXX-XXXX-XXXX-XXXX"                     # TODO: fill in and uncomment — ORCID is expected on an academic page
  pinterest        :
  soundcloud       :
  stackoverflow    : # http://stackoverflow.com/users/123456/username
  steam            :
  tumblr           :
  twitter          : 
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .DS_Store                                                                      # CHANGED: added
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock                                                                   # CHANGED: added
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  others:
    output: true
    permalink: /:collection/:path/
  collaborators:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _others
  - scope:
      path: ""
      type: others
    values:
      layout: single
      author_profile: true
      share: true
      comments: true                                                               # CHANGED: was "comment: true" (typo — singular). Same fix in _collaborators below.
  # _collaborators
  - scope:
      path: ""
      type: collaborators
    values:
      layout: single
      author_profile: true
      share: true
      comments: true                                                               # CHANGED: was "comment: true"
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Europe/Paris                                                             # CHANGED: was America/Los_Angeles — affects how post/talk dates are resolved


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji                                                                         # CHANGED: added — it was in the whitelist but missing here
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from                                                           # CHANGED: added — needed if you rename publication permalinks and want the old URLs to keep working
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
